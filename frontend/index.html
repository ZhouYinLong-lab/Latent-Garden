<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Latent Garden</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <div>
          <p class="eyebrow">COURTYARD · PERSONAL SEMANTIC GARDEN</p>
          <h1>Latent Garden<span class="dot">.</span></h1>
          <p class="intro">把寒柳别苑留下的文字放在一张温柔的地图上，让相隔很远的念头重新靠近。</p>
        </div>
        <div class="meta">
          <span id="item-count">— 篇文字</span>
          <span id="cluster-count">— 个主题</span>
        </div>
      </header>

      <section class="toolbar" aria-label="Garden controls">
        <label class="search">
          <span>⌕</span>
          <input id="search" type="search" placeholder="搜索庭院里的文字…" />
        </label>
        <div id="legend" class="legend"></div>
        <button id="reset" type="button">重置视图</button>
      </section>

      <section class="map-card">
        <div id="status" class="status">正在载入庭院地图…</div>
        <svg id="map" viewBox="-1.08 -1.08 2.16 2.16" role="img" aria-label="Interactive semantic map">
          <defs>
            <filter id="glow"><feGaussianBlur stdDeviation=".018" result="blur" /><feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge></filter>
          </defs>
          <g id="grid"></g>
          <g id="nodes"></g>
        </svg>
        <aside id="detail" class="detail" hidden>
          <button id="close-detail" class="close" type="button" aria-label="Close">×</button>
          <p id="detail-type" class="eyebrow"></p>
          <h2 id="detail-title"></h2>
          <p id="detail-description"></p>
          <div id="detail-tags" class="tags"></div>
          <a id="detail-link" target="_blank" rel="noreferrer">打开原文 ↗</a>
        </aside>
      </section>

      <footer>
        <span>文字来自 <a href="https://zylatent.com" target="_blank" rel="noreferrer">寒柳别苑</a></span>
        <span id="generated"></span>
      </footer>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
