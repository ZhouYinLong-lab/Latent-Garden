<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Latent Garden</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <div>
          <p class="eyebrow">COURTYARD · PERSONAL SEMANTIC GARDEN</p>
          <h1>Latent Garden<span class="dot">.</span></h1>
          <p class="intro">把寒柳别苑留下的文字放在一张温柔的地图上，让相隔很远的念头重新靠近。</p>
        </div>
        <div class="meta">
          <span id="item-count">— 篇文字</span>
          <span id="cluster-count">— 个主题</span>
        </div>
      </header>

      <section class="toolbar" aria-label="Garden controls">
        <label class="search">
          <span aria-hidden="true">⌕</span>
          <input id="search" type="search" placeholder="搜索庭院里的文字…" />
        </label>
        <button id="reset" type="button">重置视图</button>
        <span class="hint">滚轮缩放 · 放大后拖拽 · 点击节点打开原文</span>
      </section>

      <section class="map-card">
        <div class="map-stage">
          <div id="status" class="status">正在载入庭院地图…</div>
          <svg id="map" viewBox="-1.08 -1.08 2.16 2.16" role="img" aria-label="Interactive semantic map">
            <defs>
              <clipPath id="map-clip"><rect x="-.94" y="-.94" width="1.88" height="1.88" rx=".08" /></clipPath>
              <filter id="glow"><feGaussianBlur stdDeviation=".018" result="blur" /><feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge></filter>
            </defs>
            <rect class="map-surface" x="-.96" y="-.96" width="1.92" height="1.92" rx=".09" />
            <g id="grid" clip-path="url(#map-clip)"></g>
            <g id="edges" clip-path="url(#map-clip)"></g>
            <g id="nodes" clip-path="url(#map-clip)"></g>
            <g id="labels" clip-path="url(#map-clip)" aria-hidden="true"></g>
          </svg>
          <div class="map-note"><span class="note-mark"></span><span>相近的点，代表相近的内容语义</span></div>
          <aside id="detail" class="detail" hidden>
            <button id="close-detail" class="close" type="button" aria-label="关闭详情">×</button>
            <p id="detail-type" class="eyebrow"></p>
            <h2 id="detail-title"></h2>
            <p id="detail-description"></p>
            <div id="detail-tags" class="tags"></div>
            <a id="detail-link" target="_blank" rel="noreferrer">打开原文 ↗</a>
          </aside>
        </div>
        <aside class="topic-panel" aria-label="主题分组">
          <div class="topic-heading">
            <p class="eyebrow">EDITOR'S INDEX</p>
            <h2>精选主题</h2>
            <p>颜色代表博客策展主题。选择一个主题，地图会留下相关内容。</p>
          </div>
          <div id="legend" class="legend"></div>
        </aside>
      </section>

      <footer>
        <span class="source-credit">文字来自 <a class="blog-link" href="https://zylatent.com" target="_blank" rel="noreferrer"><img src="./assets/zylatent-icon.png" alt="" />寒柳别苑</a></span>
        <span id="generated"></span>
      </footer>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
