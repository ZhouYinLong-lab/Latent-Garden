[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "latent-garden"
version = "0.1.0"
description = "A provider-agnostic semantic map generator for Markdown, JSON, and knowledge collections."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Latent Garden contributors"}]
dependencies = []

[project.optional-dependencies]
analysis = [
  "numpy>=1.24",
  "umap-learn>=0.5.5",
  "scikit-learn>=1.3",
]
dev = ["pytest>=7.4"]

[project.scripts]
latent-garden = "pipeline.cli:main"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
include = ["core*", "pipeline*", "providers*", "adapters*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
