[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "latent-garden"
version = "0.1.0"
description = "A provider-agnostic semantic map generator for Markdown, JSON, and knowledge collections."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Latent Garden contributors"}]
keywords = ["embeddings", "semantic-map", "umap", "clustering", "knowledge-garden"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ZhouYinLong-lab/Latent-Garden"
Repository = "https://github.com/ZhouYinLong-lab/Latent-Garden"
Issues = "https://github.com/ZhouYinLong-lab/Latent-Garden/issues"
Changelog = "https://github.com/ZhouYinLong-lab/Latent-Garden/blob/main/CHANGELOG.md"

[project.optional-dependencies]
analysis = [
  "numpy>=1.24",
  "umap-learn>=0.5.5",
  "scikit-learn>=1.3",
]
api = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]
dev = ["pytest>=7.4"]
test = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pytest>=7.4",
]

[project.scripts]
latent-garden = "pipeline.cli:main"
latent-garden-api = "api.server:run"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
include = ["api*", "core*", "pipeline*", "providers*", "adapters*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
